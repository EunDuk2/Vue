<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1024" viewBox="0 0 1920 1024">
  <title>채팅창 뷰 (오른쪽 패널)</title>
  <desc>사이드바/헤더/내 채팅 목록은 좌측에 유지, 우측에 채팅창 구현</desc>

  <style>
    .headerTitle { font-family: 'Pretendard', 'Pretendard Variable', sans-serif; font-weight: 600; font-size: 16px; fill: #1C0F0F; }
    .sub { font-family: 'Pretendard', 'Pretendard Variable', sans-serif; font-weight: 400; font-size: 12px; fill: #757575; }
    .time { font-family: 'Pretendard', 'Pretendard Variable', sans-serif; font-weight: 400; font-size: 12px; fill: #999999; }
    .msg { font-family: 'Pretendard', 'Pretendard Variable', sans-serif; font-weight: 400; font-size: 14px; fill: #2A2828; }
    .me { fill: #FFE364; }
    .other { fill: #FFFFFF; }
  </style>

  <!-- 전체 배경 -->
  <rect x="0" y="0" width="1920" height="1024" fill="#F5F5F5" />

  <!-- 좌측 내 채팅 목록 영역 가이드 (280 + 목록 404 ≈ 684 유지) -->
  <rect x="0" y="0" width="280" height="1024" fill="#2A2828" />
  <rect x="280" y="0" width="404" height="1024" fill="#F5F5F5" />

  <!-- 우측 채팅 영역 컨테이너 -->
  <g id="chat-panel" transform="translate(684, 0)">
    <!-- 헤더 영역 (높이 83 동일) -->
    <rect x="0" y="0" width="1236" height="83" fill="#F5F5F5" />
    <rect x="0" y="0" width="1236" height="64" fill="#FFE364" />
    <text class="headerTitle" x="24" y="42">오르빗 디자이너 팀 채팅방</text>
    <text class="sub" x="24" y="66">멤버 6명 · 읽지 않음 4</text>

    <!-- 메시지 스크롤 영역 가이드 -->
    <rect x="0" y="83" width="1236" height="861" fill="#F5F5F5" />

    <!-- 날짜 디바이더 -->
    <g transform="translate(0, 120)">
      <line x1="24" y1="0" x2="1212" y2="0" stroke="#E5E5E5" stroke-width="1" />
      <rect x="568" y="-12" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#E5E5E5" />
      <text class="time" x="618" y="6" text-anchor="middle">2025.09.25</text>
    </g>

    <!-- 상대 메시지 버블 1 -->
    <g transform="translate(24, 160)">
      <circle cx="16" cy="16" r="16" fill="#2A2828" />
      <rect x="44" y="0" width="360" height="40" rx="12" class="other" stroke="#E5E5E5" />
      <!-- tail: left bottom -->
      <polygon points="44,26 34,34 44,34" fill="#FFFFFF" stroke="#E5E5E5" />
      <text class="msg" x="60" y="25">어제 미팅자료 잘 정리해놓으세요~~</text>
      <text class="time" x="44" y="56">오전 9:31</text>
    </g>

    <!-- 내 메시지 버블 1 -->
    <g transform="translate(0, 240)">
      <rect x="832" y="0" width="360" height="40" rx="12" class="me" />
      <!-- tail: right bottom -->
      <polygon points="1192,26 1202,34 1192,34" fill="#FFE364" />
      <text class="msg" x="852" y="25">확인했습니다. 정리본 오후에 공유드릴게요.</text>
      <text class="time" x="1192" y="56" text-anchor="end">오전 9:34</text>
    </g>

    <!-- 상대 메시지 버블 2 -->
    <g transform="translate(24, 320)">
      <circle cx="16" cy="16" r="16" fill="#2A2828" />
      <rect x="44" y="0" width="420" height="40" rx="12" class="other" stroke="#E5E5E5" />
      <!-- tail: left bottom -->
      <polygon points="44,26 34,34 44,34" fill="#FFFFFF" stroke="#E5E5E5" />
      <text class="msg" x="60" y="25">좋아요. 각자 맡은 파트도 오늘 중으로 봅시다.</text>
      <text class="time" x="44" y="56">오전 9:36</text>
    </g>

    <!-- 내 메시지 버블 2 -->
    <g transform="translate(0, 400)">
      <rect x="676" y="0" width="516" height="40" rx="12" class="me" />
      <!-- tail: right bottom -->
      <polygon points="1192,26 1202,34 1192,34" fill="#FFE364" />
      <text class="msg" x="696" y="25">네, 파일 업로드 후 링크 공유하겠습니다.</text>
      <text class="time" x="1192" y="56" text-anchor="end">오전 9:38</text>
    </g>

    <!-- 입력창 영역 -->
    <g transform="translate(0, 928)">
      <rect x="0" y="0" width="1236" height="96" fill="#F5F5F5" />
      <rect x="24" y="20" width="1036" height="56" rx="28" fill="#FFFFFF" stroke="#DDDDDD" />
      <text class="sub" x="48" y="53">메시지 입력...</text>
      <!-- 전송 버튼 -->
      <rect x="1080" y="20" width="132" height="56" rx="28" fill="#FFE364" />
      <text class="headerTitle" x="1146" y="54" text-anchor="middle">전송</text>
    </g>
  </g>
</svg>


